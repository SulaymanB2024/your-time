[project]
name = "personal-activity-ledger"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mss==10.2.0",
  "pillow==12.3.0",
  "ocrmac==1.0.1",
  "pyobjc-framework-Cocoa==12.2.2",
  "pyobjc-framework-Quartz==12.2.2",
  "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "numpy==2.4.6",
    "pytest==9.0.3",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/your_time", ".", "tools"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
src = [".", "src/your_time", "tools"]

[tool.ruff.lint]
select = ["E9", "F", "I"]
